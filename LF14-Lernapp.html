<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF14 Marketing Lernapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: "Frachtpapier" – eine ruhige Lesespalte mit Kopfleiste; Module als Sendungslabels mit LF-Codes.
   Farben: Papier, Tinte, Petrol als Akzent, Signal-Amber für Fälliges. */
:root{
  --paper:#F3F6F5; --card:#FFFFFF; --ink:#14232B; --muted:#56676F; --line:#D3DDDF; --soft:#E7EEEE;
  --accent:#0D6B70; --accent-ink:#FFFFFF; --accent-soft:#D7ECEC;
  --signal:#C77A0A; --signal-soft:#FBEBD2;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --bad:#B3261E; --bad-soft:#F8DEDB;
  --c-blue:#2F6DB5; --c-green:#3C8D50; --c-yellow:#D9A514; --c-red:#C4382E;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1518; --card:#152026; --ink:#E4EDEF; --muted:#94A6AD; --line:#27363D; --soft:#1B2A31;
  --accent:#41B5B1; --accent-ink:#06211F; --accent-soft:#16383A;
  --signal:#F0B04A; --signal-soft:#3A2C12;
  --ok:#5DC28B; --ok-soft:#163323; --bad:#F27D71; --bad-soft:#3D1C19;
  --c-blue:#6FA3E6; --c-green:#6CC184; --c-yellow:#F0C64A; --c-red:#F0776B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1518; --card:#152026; --ink:#E4EDEF; --muted:#94A6AD; --line:#27363D; --soft:#1B2A31;
  --accent:#41B5B1; --accent-ink:#06211F; --accent-soft:#16383A;
  --signal:#F0B04A; --signal-soft:#3A2C12;
  --ok:#5DC28B; --ok-soft:#163323; --bad:#F27D71; --bad-soft:#3D1C19;
  --c-blue:#6FA3E6; --c-green:#6CC184; --c-yellow:#F0C64A; --c-red:#F0776B;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:14px;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:999px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a.on{color:var(--accent-ink);background:var(--accent)}
.nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--signal);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px}

main{max-width:1040px;margin:0 auto;padding:22px 16px 80px}
.narrow{max-width:760px}

/* Bausteine */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;font-stretch:82%;letter-spacing:-.005em}
.h2{font-size:22px;font-weight:750;font-stretch:88%}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.sp{height:8px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.a{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.pill.s{border-color:transparent;background:var(--signal-soft);color:var(--signal)}
.pill.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.pill.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}

.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.s i{background:var(--signal)}

/* Start */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.count{display:flex;align-items:baseline;gap:10px}
.count .n{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.count .u{font-family:var(--f-display);font-weight:600;font-size:20px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.plan li .k{font-family:var(--f-mono);font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.plan li.done .k{background:var(--ok-soft);color:var(--ok)}
.plan li b{display:block;font-size:15.5px}
.plan li small{color:var(--muted);font-size:13.5px}
@media (max-width:520px){.plan li{grid-template-columns:28px minmax(0,1fr)}.plan li .btn{grid-column:2}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:28px;font-stretch:80%;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}

/* Modul-Label */
.label{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;position:relative;min-width:0}
.label:hover{border-color:var(--accent)}
.label .code{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em;border-bottom:1px dashed var(--line);padding-bottom:8px}
.label h3{font-size:18px;font-weight:700;font-stretch:90%}
.label .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.label.off{opacity:.55}

/* Modulseite */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.steps button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.steps button .k{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.steps button.on .k{color:var(--paper)}
.steps button.ok .k::after{content:" ✓";color:var(--ok)}
.prose{max-width:72ch}
.prose h4{font-size:18px;font-weight:700;margin:22px 0 8px;font-stretch:92%}
.prose p,.prose li{margin:6px 0}
.prose ul,.prose ol{padding-left:22px;margin:6px 0}
.prose .lead{font-size:17.5px}
.prose .note{border-left:3px solid var(--signal);background:var(--signal-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:15px}
.prose .ex{display:block;color:var(--muted);font-size:14.5px;font-style:italic}
.tw{overflow-x:auto;margin:8px 0}
table.t{border-collapse:collapse;width:100%;font-size:14.5px;min-width:480px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.blue{background:var(--c-blue)}.sw.green{background:var(--c-green)}.sw.yellow{background:var(--c-yellow)}.sw.red{background:var(--c-red)}
.diagram{margin:6px 0 18px;overflow-x:auto}
.diagram svg{display:block;max-width:100%;height:auto;min-width:420px}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* SVG */
.d-box{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.d-boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.d-boxs{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.2}
.d-line{stroke:var(--muted);stroke-width:1.4;fill:none}
.d-acc{stroke:var(--accent);stroke-width:2.4;fill:none}
.d-sig{stroke:var(--signal);stroke-width:2;fill:none}
.d-grid{stroke:var(--line);stroke-width:1;fill:none}
.d-t{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.d-tb{fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:14px}
.d-ts{fill:var(--muted);font-family:var(--f-body);font-size:11.5px}
.d-tm{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.d-ta{fill:var(--accent);font-family:var(--f-display);font-weight:700;font-size:13px}
.d-fa{fill:var(--accent)}
.d-fs{fill:var(--signal)}
.d-fsoft{fill:var(--soft)}

/* Aufgaben */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.q .qh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q .qt{font-size:18.5px;font-weight:600;line-height:1.4;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:18px;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.catrow{border-bottom:1px dashed var(--line);padding:10px 0;display:flex;flex-direction:column;gap:7px}
.catrow:last-child{border-bottom:0}
.catrow .it{font-size:15.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.right{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.should{border:2px solid var(--ok)}
.ordpool,.ordans{display:flex;flex-direction:column;gap:6px}
.ordans{min-height:44px;border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:10px}
.ordans .opt .m{color:var(--accent)}
.cloze{line-height:2.25;font-size:16.5px}
.cloze input{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;padding:1px 6px;min-width:5ch;font-size:15.5px}
.cloze input.right{border-color:var(--ok);background:var(--ok-soft)}
.cloze input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.cloze .fix{font-size:13px;color:var(--ok);font-weight:700;margin:0 3px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bank span{font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--soft)}
textarea.ta{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);resize:vertical}
.kp{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.kp input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.kp .sug{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);margin-left:6px}
.model{background:var(--soft);border-radius:8px;padding:12px 14px;white-space:pre-line;font-size:15px}
.fb{margin-top:14px;border-radius:8px;padding:10px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:3px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:3px solid var(--bad)}
.fb.mid{background:var(--signal-soft);color:var(--ink);border-left:3px solid var(--signal)}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.card-a{white-space:pre-line;font-size:17px;border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.rate button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.rate button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.rate .r0{border-color:var(--bad)}.rate .r3{border-color:var(--ok)}
.sessbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sessbar .bar{flex:1}
.timer{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:6px;background:var(--soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}

/* Blurting */
.terms{display:flex;flex-wrap:wrap;gap:6px}
.terms span{padding:3px 9px;border-radius:6px;font-size:14px}
.terms .hit{background:var(--ok-soft);color:var(--ok)}
.terms .miss{background:var(--signal-soft);color:var(--signal)}

/* ABC */
.abc{overflow-x:auto}
.abc table{border-collapse:collapse;min-width:640px;width:100%;font-variant-numeric:tabular-nums}
.abc th,.abc td{border-bottom:1px solid var(--line);padding:6px;text-align:right;font-size:14.5px}
.abc th{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.abc td:first-child,.abc th:first-child{text-align:left}
.abc input,.abc select{width:86px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--paper)}
.abc select{width:62px;text-align:left}
.abc input.right,.abc select.right{border-color:var(--ok);background:var(--ok-soft)}
.abc input.wrong,.abc select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.abc .sol{display:block;font-size:11px;color:var(--ok);font-family:var(--f-mono)}

/* Kann-Liste */
.kann{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.kann .chips .chip{font-size:12.5px;padding:3px 9px}
.kann .hint{grid-column:1/-1;font-size:13.5px}
@media (max-width:640px){.kann{grid-template-columns:1fr}}

.res-big{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:72px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50}
input[type=date],select.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card)}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.method{border-top:1px solid var(--line);padding:14px 0}
.method h3{font-size:18px;margin-bottom:4px}

</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="brand" href="#start"><b>LF14 Lernapp</b><span>Marketing · Klausur</span></a><nav class="nav" id="nav" aria-label="Hauptnavigation"></nav></div></header>
<main id="view"></main>
<script>
/* Inhalte ausschließlich aus dem Skript „LF14 Lösung Marketing 3“ (Seitenangaben = PDF-Seiten). */
const C=(q,a,s)=>({t:'card',q,a,s});
const MC=(q,o,a,x,s)=>({t:'mc',q,o,a,x,s});
const TF=(q,a,x,s)=>({t:'tf',q,a,x,s});
const CAT=(q,c,i,x,s)=>({t:'cat',q,c,i,x,s});
const ORD=(q,i,x,s)=>({t:'order',q,i,x,s});
const CLZ=(q,text,x,s)=>({t:'cloze',q,text,x,s});
const OPEN=(q,k,a,s)=>({t:'open',q,k,a,s});

const MODULES=[
/* ───────────────────────── 01 ───────────────────────── */
{id:'m01',n:'01',title:'Grundlagen des Marketings',short:'Grundlagen',exam:['14.1','14.2'],pages:'S. 1–2',diagram:'prozess',
summary:`
<p class="lead"><b>Marketing</b> = sämtliche Maßnahmen eines Unternehmens mit dem Ziel der <b>Absatzförderung</b>.</p>
<h4>Warum Marketing für Speditionen wichtig ist</h4>
<ul>
<li>Seit der <b>Deregulierung</b> des Verkehrsmarktes (= Öffnung des Marktzugangs für Wettbewerber, Befreiung von staatlichen Restriktionen) hat sich der Wettbewerb verschärft.</li>
<li>Aus einem <b>Verkäufermarkt</b> (begrenzte Zahl von Anbietern, viele Nachfrager) wurde ein <b>Käufermarkt</b> (das Angebot übersteigt die Nachfrage).</li>
<li>Nur mit niedrigeren Preisen als die Konkurrenz zu akquirieren, wirkt nur <b>kurzfristig</b>: Es fehlen Überschüsse für notwendige Investitionen (z.&nbsp;B. moderne Lagerhalle, moderne Technologie). Die Spedition wird langfristig weniger konkurrenzfähig. Werden Kundenanforderungen nicht erfüllt, gehen Kunden zur Konkurrenz, egal wie günstig die Leistung ist.</li>
</ul>
<h4>Kennzeichen eines erfolgreichen Marketings</h4>
<p>Systematisch, langfristig angelegt und konsequent am Markt orientiert:</p>
<table class="t"><tr><th>Kennzeichen</th><th>Erläuterung</th></tr>
<tr><td>Kundenorientierung</td><td>Gezielte Orientierung an den Problemen, Wünschen und Bedürfnissen der Kunden</td></tr>
<tr><td>Organisationsanpassung</td><td>Anpassung der gesamten Unternehmensorganisation an die Anforderungen des Kunden</td></tr>
<tr><td>Marktsegmentierung</td><td>Aufteilung des Gesamtmarktes in gleichartige Teilmärkte (z.&nbsp;B. geografische Gebiete, Kleinsendungen)</td></tr>
<tr><td>Wettbewerbsorientierung</td><td>Streben nach einem Wettbewerbsvorteil gegenüber der Konkurrenz</td></tr>
<tr><td>Markterschließung</td><td>Systematische Suche nach neuen Märkten und deren Erschließung</td></tr>
<tr><td>Zielorientierung</td><td>Ausrichtung aller Aktivitäten an den Marketing- und Unternehmenszielen</td></tr></table>
<h4>Der Marketing-Prozess</h4>
<p>Marketing ist <b>keine einmalige Maßnahme</b>, sondern ein Prozess in Phasen:</p>
<ol>
<li><b>Analyse der Marketing-Situation</b>: Mit Marktforschungsinstrumenten wird die Position der Spedition am Markt untersucht.</li>
<li><b>Entwicklung des Marketing-Konzeptes</b>: Ziele festlegen (häufig Optimierung des Gewinns), dann eine Strategie entwickeln.</li>
<li><b>Ergreifen von Marketing-Maßnahmen</b>: Maßnahmen auswählen (Marketing-Mix-Planung) und durchführen; ggf. organisatorische und personelle Voraussetzungen schaffen (Marketing-Mix-Realisierung).</li>
<li><b>Kontrolle der Ergebnisse</b>: Wurde der beabsichtigte Erfolg erreicht? Kann zu einer erneuten Überarbeitung führen.</li>
</ol>`,

{id:'m02',n:'02',title:'Marktuntersuchung & Marktforschung',short:'Marktuntersuchung',exam:['14.1','14.2'],pages:'S. 7–14, 140–143',diagram:'markt',
summary:`
<p class="lead"><b>Marktuntersuchung</b> = Beschaffung von Informationen für die Beurteilung eines Marktes.</p>
<h4>Arten der Marktuntersuchung</h4>
<ul>
<li><b>Markterkundung</b> = unsystematisches, gelegentliches Sammeln von Informationen. Beispiele: Kundengespräche, Berichte von Reisenden, Messebesuche, Marktberichte in Fachzeitschriften.</li>
<li><b>Marktforschung</b> = systematische, mit wissenschaftlichen Methoden durchgeführte Untersuchung des Marktes.</li>
</ul>
<h4>Zwei Möglichkeiten der Marktforschung</h4>
<ul>
<li><b>Marktanalyse</b> = einmalige Untersuchung des Marktes zu einem bestimmten Zeitpunkt (Zeitpunkt-Untersuchung, z.&nbsp;B. einmalige Befragung).</li>
<li><b>Marktbeobachtung</b> = laufende Untersuchung des Marktes über einen Zeitraum (Zeitraum-Untersuchung, z.&nbsp;B. Panel). Fallbezogene Möglichkeiten: Analyse von Kundengesprächen, Auswertung amtlicher Statistiken, Auswertung von Veröffentlichungen der Verbände, Auswertung von Fachzeitschriften.</li>
</ul>
<h4>Zwei Methoden der Marktforschung</h4>
<table class="t"><tr><th></th><th>Primärforschung</th><th>Sekundärforschung</th></tr>
<tr><td>Auch</td><td>Field-Research, Feldforschung</td><td>Desk-Research, Schreibtischforschung</td></tr>
<tr><td>Was</td><td>Eigene Erhebungen oder Erhebungen durch Marktforschungsinstitute; neue Daten konkret zu einer Forschungsfrage</td><td>Auswertung bereits vorhandener Daten, die schon für andere Zwecke erstellt wurden</td></tr>
<tr><td>Beispiele</td><td>Schriftliche Befragung, Interview, Panelerhebung, Beobachtung, Experiment, Markttest, Gruppendiskussion</td><td><b>innerbetrieblich</b>: Umsatz-/Absatzstatistiken, Verkaufsberichte, Reklamationsschreiben, Daten der Lagerbuchhaltung, Außendienstberichte<br><b>außerbetrieblich</b>: Statistische Jahrbücher, Statistiken und Berichte der IHK, Wirtschaftsverbände (z.&nbsp;B. DSLV), Statistisches Bundesamt, BAG, Banken, Fachzeitschriften, Geschäftsberichte anderer Unternehmen</td></tr>
<tr><td>Vorteile</td><td>Präzise Informationen zu einer bestimmten Forschungsfrage, genau auf das Unternehmen zugeschnitten</td><td>Günstiger, schnellere Generierung der Informationen</td></tr>
<tr><td>Nachteile</td><td>Teuer, hoher Zeit- und Arbeitsaufwand, Durchführung meist durch Marktforschungsunternehmen</td><td>Ungenau, meist weitere Forschungsdaten zur genauen Ursachenforschung nötig</td></tr></table>
<h4>Ziel: Marktprognose</h4>
<p><b>Marktprognose</b> = Abschätzung und Vorausberechnung der zukünftigen Marktverhältnisse als Grundlage für den Einsatz der <b>absatzpolitischen Instrumente</b>. Sie gibt Aufschluss über Wünsche und Bedürfnisse der Kunden; daran sollen die Maßnahmen des Marketing-Mixes ausgerichtet werden, nur so ist die Nachfrage langfristig gesichert.</p>
<h4>Was die Marktuntersuchung liefert</h4>
<p>Überblick über die Marktverhältnisse der eigenen Branche, Informationen über die Konkurrenz, über erfolgversprechende Werbeträger und über das Kundenpotenzial.</p>
<p class="note">Ziele der Marktforschung sind z.&nbsp;B.: Kundenbedürfnisse ermitteln, Informationen über die wirtschaftliche Situation von Kunden und Konkurrenten, Informationen über die Konkurrenz (z.&nbsp;B. Branchenreport). <b>Keine</b> Ziele: Mitarbeiterbedürfnisse, Investitionslage der Regierung, Stellenausschreibungen.</p>`,

{id:'m03',n:'03',title:'Absatzpolitische Instrumente (Marketing-Mix)',short:'Marketing-Mix',exam:['14.1','14.2'],pages:'S. 16–37',diagram:'mix',
summary:`
<p class="lead">Die Instrumente werden gezielt eingesetzt und kombiniert (= <b>Marketing-Mix</b>), damit sie in optimaler Abstimmung zu einem größtmöglichen Verkaufserfolg führen. Die vier klassischen Instrumente: <b>Produktpolitik, Preispolitik, Kommunikationspolitik, Distributionspolitik</b>.</p>
<h4>1. Produktpolitik</h4>
<p>Das Produkt ist das Leistungsergebnis eines Unternehmens, um Probleme bzw. Bedürfnisse der Kunden zu befriedigen; auch Dienstleistungen, Personen oder ganze Regionen. Produktpolitik = alle Tätigkeiten, die mit der Auswahl und Weiterentwicklung eines Produktes sowie dessen Vermarktung zusammenhängen, bzw. die Produkte permanent den Bedürfnissen der Verladerschaft anpassen.</p>
<table class="t"><tr><th>Produktgestaltung</th><th>Bedeutung</th></tr>
<tr><td>Produktdifferenzierung</td><td>Bestehendes Produkt wird um neue Varianten ergänzt, Programm wird erweitert. Neue Zielgruppen, Sonderwünsche, ohne bisherige Kunden aufzugeben.</td></tr>
<tr><td>Produktdiversifikation / -innovation</td><td>Neues Produkt wird entwickelt, echte Innovation oder Nachahmung („Me-too-Innovation“). Ziel: Produktpalette erweitern, Unternehmensrisiko verringern.</td></tr>
<tr><td>Produktvariation (Relaunch)</td><td>Bestehendes Produkt wird in seinen Eigenschaften geändert/überarbeitet, damit es als fortschrittlich wahrgenommen wird (Absatzanreize).</td></tr>
<tr><td>Produkteliminierung</td><td>Produkt wird vom Markt genommen, wenn keine befriedigenden Umsätze mehr erwartet werden bzw. nicht einmal die Fixkosten gedeckt sind.</td></tr></table>
<p class="ex">Spedition: neue Sammelladungsrelation, Tracking-and-Tracing-System, Just-in-Time-Lieferungen, erweitertes Logistikangebot im Lebensmittelbereich, Einstellung der Lkw-Exporte nach Russland.</p>
<h4>2. Preispolitik</h4>
<p>Externe Einflussfaktoren: Angebot und Nachfrage, Zahl der Mitbewerber, Kundenverhalten, gesetzliche Einflüsse. Interne: Kosten, Bedarfsentwicklung, Marketingstrategie. Der Preis ist Entgelt für eine Leistung und Maßstab für die Kaufentscheidung. Preispolitik umfasst Bildung und Veränderung eines Preises, Preisfeststellung, Differenzierung von Preisen und die Festlegung von Verkaufskonditionen.</p>
<p class="ex">Spedition: Mengenrabatt im Containerverkehr, kostenloser Testlauf für einen Großkunden, Staffelung der Beförderungspreise für Paletten, saisonbedingte Preissteigerungen.</p>
<h4>3. Kommunikationspolitik</h4>
<p>Ziel: Einstellungen, Kenntnisse oder Verhaltensweisen der Marktteilnehmer (v.&nbsp;a. potenzieller Kunden) beeinflussen, ein Produkt bekannt machen und den Verkauf fördern. Drei Bereiche:</p>
<ul>
<li><b>Werbung</b>: systematische Beeinflussung von (potenziellen) Käufern. Werbeplanung: Zielgruppe, Inhalt der Botschaft, wann, wo, mit welchen Werbemitteln (Anzeigen, Handzettel, Plakate, Spots …). Aufbau nach <b>AIDA</b>: Attention, Interest, Desire, Action. <span class="ex">Annonce in der DVZ, Prospekte auf der Transportmesse</span></li>
<li><b>Sales Promotion</b> = Verkaufsförderung: unterstützt Werbung durch zusätzliche Kaufanreize (Muster, Proben, Messen). <span class="ex">Kalender/Kugelschreiber mit Logo, Kundenverwöhn-Programm, Messestand</span></li>
<li><b>Public Relations</b> = Öffentlichkeitsarbeit: Imageförderung des <i>gesamten</i> Unternehmens, Vertrauen gewinnen (Pressekonferenzen, Betriebsbesichtigungen, Vorträge, Broschüren). <span class="ex">Homepage mit Unternehmensphilosophie, Spenden, Hilfstransporte, Ehrung von Mitarbeitern, ISO-Zertifizierung</span></li>
</ul>
<h4>4. Distributionspolitik</h4>
<p>Distribution = Verteilung. Den Weg wählen, auf dem das Produkt/die Dienstleistung am besten an den Kunden gelangt, d.&nbsp;h. geeignete Vertriebswege wählen.</p>
<p class="ex">Spedition (laut Lösung): Mailingaktionen, Telefonmarketing, persönliche Kundenverkaufsgespräche, Key Account Manager.</p>
<p class="note">Achtung: In ÜA I, Aufgabe 4 wird ein persönlicher Werbebrief (Mailing) als <b>Werbung (Direktwerbung)</b> gewertet, Kundenbesuche als Werbung (Verkaufsgespräch auch möglich). Begründe in der Klausur immer kurz.</p>`,

{id:'m04',n:'04',title:'Corporate Identity',short:'Corporate Identity',exam:['14.1'],pages:'S. 38–43',diagram:'ci',
summary:`
<p class="lead"><b>Corporate Identity (CI)</b> = komplexes strategisches Konzept, das inhaltlich und formal alle Unternehmensaktivitäten abstimmt, zur Schaffung einer unverwechselbaren Persönlichkeit und um die Akzeptanz der Leistungen zu steigern. Sie entspricht dem entworfenen <b>Selbstbild</b> des Unternehmens.</p>
<p>Häufig werden die Instrumente der Kommunikationspolitik einer übergreifenden CI-Strategie unterworfen: ein einheitliches Erscheinungsbild nach außen (Kunden, Lieferanten, Behörden) und nach innen (Mitarbeiter).</p>
<h4>Die drei Säulen der CI</h4>
<table class="t"><tr><th>Säule</th><th>Bedeutung</th><th>Beispiele Logistik</th></tr>
<tr><td>Corporate Design (CD)</td><td>visuelles Erscheinungsbild</td><td>Logo, Prospekte, Mitarbeiterkleidung, Internetauftritt, Büros, Lkw-Planen</td></tr>
<tr><td>Corporate Behavior (CB)</td><td>Unternehmensverhalten und -kultur</td><td>Verhandlungsstil, Telefonverhalten, Führungsstil/Umgangston, Zahlungsmoral, Umgang mit Kritik</td></tr>
<tr><td>Corporate Communication (CC)</td><td>Unternehmenskommunikation</td><td>Werbemaßnahmen, Öffentlichkeitsarbeit (PR), interne Kommunikation</td></tr></table>
<p class="note">Andere Quellen unterscheiden zusätzlich Corporate Philosophy (Werte, Selbstbild) und Corporate Culture.</p>
<h4>CI im Unternehmen verankern</h4>
<p>Einheitliche Verwendung von Farbe, Schriftart, Sprache und Logos auf allen Printmedien wie Briefpapier, Website, Lkw-Planen, Flyern, einheitliche Diensthemden.</p>
<h4>CI und Marketing</h4>
<ul>
<li>Greifen alle Säulen ineinander, entsteht ein einheitliches Bild; die Philosophie wird sichtbar, das Unternehmen grenzt sich ab.</li>
<li>CI unterstützt PR und Öffentlichkeitsarbeit, beeinflusst das Image und hilft so, Kunden zu gewinnen und zu binden. Daher ist CI Bestandteil des Marketings.</li>
<li>Ist die gelebte CI uneinheitlich, sind Werbung und PR wenig glaubwürdig. Die aktive Gestaltung der CI ist eine Marketingaufgabe.</li>
<li>Einheitliches Design erzeugt Wiedererkennung (auch unterbewusst). Besonders relevant für große Unternehmen, Kooperationen, nach Fusionen, bei direktem Kundenkontakt. Bei Mitarbeitern entsteht ein Wir-Gefühl (Identifikation, Motivation).</li>
</ul>`,

{id:'m05',n:'05',title:'Kundenbindung & Qualitätsmanagement',short:'Kundenbindung & QM',exam:['14.1'],pages:'S. 44–56',diagram:null,
summary:`
<p class="lead">Kunden zu gewinnen ist statistisch betrachtet <b>siebenmal teurer</b> als Kunden zu halten (S.&nbsp;44); es gibt kein preiswerteres Marketing als die <b>Weiterempfehlung</b>. Stammkunden bleiben gerade in Krisen eher treu.</p>
<p class="note">Im Infotext Kundenpflege (LH10, S.&nbsp;128) steht „fünfmal so viel“. Merke dir beide Quellen.</p>
<h4>Kundenbindungsmaßnahme</h4>
<p>Sämtliche Maßnahmen eines Dienstleistungsunternehmens, die das Kaufverhalten des Kunden gegenüber dem Anbieter positiv beeinflussen sollen. Ziel: den Kunden langfristig binden, die Kundenbeziehung stabilisieren und ausweiten.</p>
<h4>Social Media und Kennzahlen</h4>
<p>73 % der Unternehmen nutzen Social Media (Bitkom). Eine <b>Kennzahl</b> fasst quantitative, in Zahlen ausgedrückte Informationen zusammen. Im Social Media zeigt sie den Erfolg auf Netzwerken: <b>Follower/Fans</b> (angemeldete Nutzer), <b>Reichweite</b> (potenzielle maximale Größe des Publikums, nicht tatsächlich gesehen), <b>Nutzung der Seite</b> (Link-Klicks, Foto-/Video-Aufrufe).</p>
<h4>Primär-, Sekundärleistung, Add-on-Service</h4>
<ul>
<li><b>Primärleistung</b> = Kernleistung. <b>Sekundärleistung</b> = Zusatzleistung (Beratung, Kundendienst, Garantien), stiftet zusätzlichen Nutzen.</li>
<li><b>Add-on-Services</b>: Leistungen zusätzlich zum Kernprodukt (z.&nbsp;B. Organisation von Transporten) zur Steigerung der Zufriedenheit und Kundenbindung. Sie ergänzen das Produktportfolio, daher <b>Produktpolitik</b>.</li>
<li><b>Value-Added-Services</b> = Mehrwertdienstleistungen, die einen höheren Preis rechtfertigen.</li>
<li>Digitale Beispiele: Warehouse-Management-Systeme, Software für Echtzeit-Störungsmanagement, Logistik-Apps (Mobile CRM), Fahrer-Apps (Lenk- und Ruhezeiten), Online-Frachtbörsen, Transportverfolgung per App.</li>
<li>Logistik entlang der Wertschöpfungskette: Transport, Umschlag, Lager (TUL) plus Lagerverwaltung, Auftragsabwicklung. Man unterscheidet <b>Pre-Sales-, During-Sales- und After-Sales-Maßnahmen</b> (vor, während, nach dem Kauf).</li>
</ul>
<h4>Kundenzufriedenheit</h4>
<p>Wichtigster Kundenbindungsfaktor. Grundregel: Je mehr die Erfahrungen des Kunden seine anfänglichen Erwartungen übertreffen, desto zufriedener ist er. Dazu: Produktversprechen einhalten, hochwertige Leistungen anbieten, Probleme schnell und effizient lösen.</p>
<p>Überprüfen über: Nachfrage, Beschwerden, Kündigungen, Reklamationen. Instrumente: Beschwerdemanagement, Kundenbefragung, Testläufe durch eigene Mitarbeiter, Testläufe bei Mitbewerbern.</p>
<h4>Qualitätsmanagement (QM)</h4>
<p>DIN EN ISO 9001 = Qualitätsmanagementnorm mit verbindlichen Standards, Zertifizierung oft „must have“ (z.&nbsp;B. durch TÜV).</p>
<table class="t"><tr><th>Begriff</th><th>Definition</th><th>Beispiel Spedition</th></tr>
<tr><td>Qualitätsmanagement</td><td>Funktion und alle organisatorischen Maßnahmen zur Verbesserung der Prozess-, Arbeits- und damit Produkt-/Dienstleistungsqualität</td><td>–</td></tr>
<tr><td>Qualitätsplanung</td><td>gedankliche Vorwegnahme der zukünftigen Beschaffenheit</td><td>85 % der Kunden bewerten „gut“; max. 1 % Beschwerdequote; 0,5 % Fehllieferungsquote</td></tr>
<tr><td>Qualitätskontrolle</td><td>auch Q-Sicherung; Ansätze zur Sicherstellung festgelegter Anforderungen</td><td>regelmäßige Evaluation mit A-Kunden, Betriebsbesichtigungen</td></tr>
<tr><td>Qualitätsprüfung</td><td>konkrete Ermittlung, ob Bedingungen erfüllt sind (z.&nbsp;B. DIN 1319)</td><td>Fehllieferungsquote ermitteln, Belabelung prüfen</td></tr>
<tr><td>Qualitätssteuerung</td><td>Qualitätslenkung: Überwachung eines Prozesses und Beseitigung von Ursachen</td><td>B/Ls für LC-Geschäfte von mind. zwei Mitarbeitern bearbeitet, Unterschrift</td></tr>
<tr><td>Qualitätsverbesserung</td><td>stetige Verbesserung von Abläufen, Techniken, Dokumentation</td><td>Papiere digital; Boni für Verbesserungsvorschläge</td></tr></table>`,

{id:'m06',n:'06',title:'Kunden-ABC-Analyse',short:'ABC-Analyse',exam:['14.2'],pages:'S. 58–66, 81–86, 144–149',diagram:'abc',
summary:`
<p class="lead">Ressourcen (Personal, finanzielle Mittel) sind beschränkt, daher werden Kunden nach ihrer Wertigkeit eingeteilt. Bei der <b>Kunden-ABC-Analyse</b> werden Kunden nach ihrem <b>Umsatz</b> (meist eines Jahres) klassifiziert und mit unterschiedlicher Intensität betreut: <b>A</b> sehr wichtig, <b>B</b> wichtig, <b>C</b> weniger wichtig.</p>
<p>ABC-Analyse = Verfahren zur Priorisierung von Kunden, Aufgaben, Problemen, Produkten und Aktivitäten; Erkennen von Schwerpunkten. (Aus LF 9 bekannt: dort für Güter im Lager.)</p>
<h4>Vorgehensweise</h4>
<ol>
<li>Umsatzsumme aller Kunden ermitteln.</li>
<li>Kunden nach Umsatz sortieren (Rangfolge absteigend).</li>
<li>Prozentualen Anteil jedes Kunden am Gesamtumsatz ermitteln.</li>
<li>Prozentanteile kumulieren (von oben nach unten aufaddieren).</li>
<li>Kunden einer Kategorie A, B oder C zuordnen, z.&nbsp;B. <b>nach Umsatz</b> A 70 %, B 20 %, C 10 % oder <b>nach Kundenanzahl</b> A 20 %, B 30 %, C 50 %.</li>
</ol>
<p>Grafik: x-Achse = mengenmäßiger Anteil (Kunden), y-Achse = wertmäßiger Anteil (kumulierter Umsatz).</p>
<h4>Folgerungen für das Marketing</h4>
<ul>
<li><b>A-Kunden</b>: Verlust eines Kunden kann das Unternehmen gefährden; individuelle Kundenbindungsstrategien, verstärkte Marketingmaßnahmen, Marketing an ihnen orientieren.</li>
<li><b>B-Kunden</b>: noch stark für den Erfolg verantwortlich; „kundenbezogene“ Maßnahmen, Halten und Ausbau. Sie können zu A-Kunden aufsteigen.</li>
<li><b>C-Kunden</b>: einfache, kostengünstige Maßnahmen; tragen ggf. zur Deckung der Fixkosten bei; evtl. sogar aufgeben.</li>
</ul>
<h4>Vorteile / Möglichkeiten</h4>
<p>Allgemein gültig und einfach anwendbar, geringer Aufwand, Überblick über den Umsatz der Kunden, große Datenmengen klassifizierbar, übersichtliche grafische Darstellung, strategisch sinnvoll für zielgerichtete Entscheidungen zum Marketing-Mix, in vielen Bereichen anwendbar.</p>
<h4>Nachteile / Grenzen</h4>
<p>Nur quantitative Faktoren (nur der Umsatz; Umsatz = Absatzmenge × Preis, aber Gewinn = Umsatz − Kosten), keine qualitativen Faktoren (Entwicklungs-/Innovationspotenzial, Treue, Meinungsführer), Vergangenheits- bzw. IST-Betrachtung, Arbeitsaufwand und Ärger durch Kunden bleiben unberücksichtigt, A-Kunden kosten evtl. zu viel Marketinggeld, schwierig bei geringen Umsatzunterschieden oder neuen Geschäftsbeziehungen, nur grobe Einteilung in drei Klassen.</p>
<h4>Weitere Einsatzbereiche</h4>
<p>Priorisierung von Aufgaben, Problemen, Produkten und Aktivitäten, Warenbeschaffung, Personaleinsatzplanung, Projektmanagement, Materialwirtschaft.</p>`,
recall:['Umsatz','Rangfolge|sortieren','Prozent|Anteil','kumulieren|kumuliert','A-Kunden','B-Kunden','C-Kunden','Priorisierung','quantitativ','qualitativ','Vergangenheit|IST','Gewinn','Kundenbindung','70','20','10','50','30'],

OPEN('Würden Sie der XPressParcel AG die ABC-Analyse auch künftig empfehlen? Nennen Sie je drei Möglichkeiten und Grenzen.',['Möglichkeiten: Überblick über Kundenumsätze, große Datenmengen klassifizieren','einfach und schnell, übersichtliche grafische Darstellung, vielseitig anwendbar','Grenzen: nur Umsatz, nicht Gewinn/Kosten','keine qualitativen Faktoren/Potenzial, Vergangenheitsbetrachtung','grobe Einteilung, Probleme bei geringen Unterschieden'],'Möglichkeiten: Überblick über den Umsatz der Kunden; Klassifizierung großer Datenmengen; einfach und schnell anwendbar; übersichtliche grafische Darstellung; in vielen Bereichen einsetzbar. Grenzen: orientiert sich nur am Umsatz (Gewinn = Umsatz − Kosten, ein Kunde kann sich trotzdem nicht rentieren); Aufwand/Ärger durch Kunden bleibt unberücksichtigt; kein Blick auf Potenzial/qualitative Faktoren; Vergangenheitsbetrachtung; A-Kunden kosten evtl. zu viel Marketinggeld; schwierig bei geringen Umsatzunterschieden; nur grobe Einteilung. Empfehlung: ja, aber ergänzt um qualitative Merkmale.','S. 148')

{id:'m07',n:'07',title:'Das Verkaufsgespräch',short:'Verkaufsgespräch',exam:['14.2'],pages:'S. 67–72',diagram:'verkauf',
summary:`
<p class="lead">Ziel: herausfinden, was der Kunde wünscht, und ihm eine passende Dienstleistung mit möglichst großem Nutzen anbieten. Der Kunde ist <b>Partner</b>; kein aufgesetztes Rollenspiel, sondern freundliche Atmosphäre. Kostenersparnisse und Zeitvorteile sind entscheidende Argumente.</p>
<h4>Vorbereitung</h4>
<ul>
<li><b>Ziele festlegen</b>: neuen Kunden gewinnen oder Kunden weiter überzeugen; Kapazitäten prüfen; Teilziele (Sympathie erzeugen, Kontakte in Abteilungen, Kundenphilosophie kennenlernen, Leistungspräsentation, Konflikte lösen). Gespräch gedanklich durchspielen.</li>
<li><b>Informationen sammeln</b>: Handelskammer, Wirtschaftsverbände, Fachzeitschriften, Geschäftsberichte, persönliche Gespräche, eigene Kundenunterlagen/Kundenkartei; bei bestehender Beziehung: Verlauf, Auftragsentwicklung (Mengen, Orte, Häufigkeit), Probleme.</li>
</ul>
<p class="note">Merke: Natürlichkeit, Offenheit und echtes Interesse erzeugen Sympathie. Standardeinstiege („Ihre Büros sind aber schön“) werden erkannt.</p>
<h4>Körpersprache</h4>
<p>Hände in den Taschen = schlechte Manieren; verschränkte Arme/angespannter Ausdruck = Verschlossenheit; zurückgelehnte Haltung = herablassend. Immer im Zusammenhang mit dem gesprochenen Wort; nonverbale Signale des Partners beachten; angemessene Kleidung = Wertschätzung (Firmenphilosophie beachten).</p>
<h4>Fragetechniken</h4>
<table class="t"><tr><th>Frage</th><th>Merkmal</th><th>Beispiel</th></tr>
<tr><td>Offene Frage</td><td>W-Fragen, liefern Informationen, keine Ja/Nein-Antwort</td><td>„Wie hoch ist Ihr Sendungsaufkommen im Monat?“</td></tr>
<tr><td>Geschlossene Frage</td><td>Antwort Ja/Nein; prüft Verständnis; vorsichtig einsetzen (ein „Nein“ wirkt negativ)</td><td>„Gefällt Ihnen mein Vorschlag?“</td></tr>
<tr><td>Suggestivfrage</td><td>soll die Meinung beeinflussen; manipulativ, wird schnell durchschaut</td><td>„Sie sind doch auch der Meinung, dass …?“</td></tr>
<tr><td>Emotionale Frage</td><td>zielt auf Gefühle; unverbindlich; gut zu Gesprächsbeginn für Vertrauen</td><td>„Was hat Ihnen an unserem Angebot besonders gefallen?“</td></tr>
<tr><td>Aufschließende Frage</td><td>öffnet in schwierigen Situationen durch Verallgemeinerung</td><td>„Von vielen Kunden hören wir, dass …“</td></tr></table>
<h4>Ablauf im Gespräch</h4>
<ul>
<li><b>Bedarfsanalyse</b>: nicht nur „Wie viele Sendungen?“, sondern Unternehmen/Ziele, Einstellungen, Mitbewerber, Entscheidungsprozesse, wirtschaftliche Lage, Anforderungen an den Spediteur, Entscheidungskriterien, Zufriedenheit mit bisherigen Lösungen.</li>
<li><b>Kundenmotivation</b> herausfinden: z.&nbsp;B. Eilzustellung von Ersatzteilen → Wunsch nach Zuverlässigkeit → Stunden-Service anbieten.</li>
<li><b>Überzeugen und Argumentieren</b>: Argumente wirken nur, wenn sie einen <b>Gewinn/Nutzen</b> für den Kunden versprechen; Leistungsvergleich zu Mitbewerbern, Grenzen nicht verschweigen. Nicht nur Leistungsmerkmale aufzählen, sondern den Nutzen erläutern.</li>
<li><b>Einwände</b>: jeden Einwand beantworten; Gründe herausfinden (Ausrede, Vorwand, Scheinargument?); Einwände vorwegnehmen (bewährt am Telefon).</li>
<li><b>Abschluss</b>: Nutzen zusammenfassen, Einigung anstreben; braucht der Kunde Zeit, Zustimmung zum Nachfassen einholen; nachfassen, ohne zu bedrängen.</li>
</ul>
<h4>Die Phasen eines Verkaufsgesprächs</h4>
<p>0 Vorbereitungsphase (zählt nicht zu den Gesprächsphasen) · 1 Aufmerksamkeitsphase (Kontaktphase, Einstieg) · 2 Analysephase (Bedarfsanalyse, Fragephase) · 3 Angebotsphase · 4 Argumentationsphase (Einwandbehandlung) · 5 Abschlussphase (Abschluss, Ausstieg).</p>`,
recall:['Ziele','Informationen','Partner','Körpersprache','offene Frage|W-Frage','geschlossene','Suggestiv','emotional','aufschließend','Bedarfsanalyse','Motivation','Nutzen','Einwand|Einwände','Abschluss','nachfassen','Aufmerksamkeitsphase|Kontaktphase','Analysephase','Angebotsphase','Argumentationsphase','Abschlussphase'],
items:[
C('Nenne die fünf Hauptphasen eines Verkaufsgesprächs (plus Vorbereitung).','0 Vorbereitungsphase\n1 Aufmerksamkeitsphase (Kontaktphase/Einstieg)\n2 Analysephase (Bedarfsanalyse/Fragephase)\n3 Angebotsphase\n4 Argumentationsphase (Einwandbehandlung)\n5 Abschlussphase','S. 71'),

{id:'m08',n:'08',title:'Das Marketingkonzept (XPressParcel AG)',short:'Marketingkonzept',exam:['14.2'],pages:'S. 73–99, 105–111, 138–158',diagram:'pyramide',
summary:`
<p class="lead">Fallsituation: Die <b>XPressParcel AG</b> (KEP-Dienstleister, Hamburg) hat Probleme. Aus der Analyse der Unterlagen wird über die Marktuntersuchung ein neues Produkt und ein <b>Marketingkonzept</b> entwickelt.</p>
<h4>Situationsanalyse der XPressParcel AG</h4>
<table class="t"><tr><th>Lief erfolgreich</th><th>Weniger erfolgreich</th></tr>
<tr><td>Branche wächst weiter (+5,7 %)</td><td>Auftragsvolumen national −2,3 % und insgesamt rückläufig</td></tr>
<tr><td>Sponsoring FC St. Pauli zur Imagepflege</td><td>Auftragsrückgang beim Großkunden Markus Schmidt OHG</td></tr>
<tr><td>Zukunft: neue Produkte sollen entwickelt werden</td><td>HansaAir setzt weiteren Paket-/Expressdienst ein (25,1 → 23,4)</td></tr>
<tr><td></td><td>Umsatzerlöse −4,32 %, Marktanteil −7,9 %</td></tr>
<tr><td></td><td>Nachhaltigkeit noch nicht ausgereift (erst 56 % des Fuhrparks Euro VI); 95 % der Kunden beziehen Nachhaltigkeit in den Angebotsvergleich ein</td></tr></table>
<p><b>Zusammenhang zur Marketingabteilung</b>: Mit Daten wird die Situation analysiert, dann werden in der Marktuntersuchung die Ursachen erforscht (Markt und eigene Position). Auf dieser Grundlage bekämpft die Marketingabteilung die Ursachen mit Marketingmaßnahmen.</p>
<p><b>Ziel der Marktuntersuchung = Marktprognose</b>: Prognose der künftigen Marktentwicklung, Bestimmung der absatzpolitischen Instrumente im Marketingkonzept, Umsatzerhöhung und Kundenbindung/-pflege.</p>
<h4>Die fünf Phasen eines Marketingkonzepts</h4>
<ol>
<li><b>Situationsanalyse</b>: spezifische Situation des Unternehmens erfassen, Chancen und Probleme identifizieren.</li>
<li><b>Marketingziele</b>: quantitative Ziele (Umsatzzahlen, Absatz) und/oder qualitative Ziele (Kundenzufriedenheit, Image).</li>
<li><b>Marketingstrategie</b>: Strategien/Vorgehensweisen zur Zielerreichung; welche Märkte? Verhalten gegenüber Kunden und Konkurrenz?</li>
<li><b>Marketingmaßnahmen</b>: konkrete operative Maßnahmen = Marketing-Mix (Produkt-, Preis-, Kommunikations-, Distributionspolitik).</li>
<li><b>Marketing-Controlling</b>: Kontrolle anhand bestimmter Kontrollgrößen, Effizienz der Maßnahmen prüfen.</li>
</ol>
<h4>Musterlösung (Auszug)</h4>
<ul>
<li>Situationsanalyse: Umsatzrückgang; Kundenbindung und Neukundengewinnung; Risikostreuung durch Erweiterung der Produktpalette, neue Märkte.</li>
<li>Ziele: quantitativ Umsatzzuwachs; qualitativ neues Produkt erfolgreich positionieren.</li>
<li>Strategie: neuer Markt „nachhaltige Transportmittel“; Kundengewinnung durch eigenes Know-how, steigende Relevanz der Nachhaltigkeit, Zielgruppe andere Transportunternehmen.</li>
<li>Produktideen: City-Logistik letzte Meile (Hub im GVZ, Straßenbahn), E-Transporter (wie StreetScooter), Zustellroboter, Drohnen, „Rohrpost“-Zustellung.</li>
</ul>`,

{id:'m09',n:'09',title:'Produktpolitik & Produktlebenszyklus',short:'Produktlebenszyklus',exam:['14.2'],pages:'S. 117–119, 153',diagram:'plz',
summary:`
<p class="lead"><b>Produktpolitik</b> umfasst alle Maßnahmen des Herstellungs- bzw. Produktionsunternehmens, um das Angebot den sich wandelnden Bedürfnissen der Käufer anzupassen. Die <b>Sortimentspolitik</b> dagegen umfasst die Maßnahmen des <b>Handelsunternehmens</b>, das das Produkt in sein Sortiment aufnimmt, um den Absatz zu steigern.</p>
<h4>Der Produktlebenszyklus (5 Phasen)</h4>
<p>Zeitlauf eines Produktes von der Markteinführung bis zum Marktaustritt. Spezifische Maßnahmen können Phasen verlängern oder verkürzen.</p>
<table class="t"><tr><th>Phase</th><th>Merkmale</th><th>Maßnahmen</th></tr>
<tr><td>1. Einführung</td><td>Markteintritt; noch keine Gewinne; Nachfrage gering (unbekannt) oder Liefer-/Herstellungsengpässe</td><td>schnell hohen Bekanntheitsgrad erzielen: Werbe- und PR-Maßnahmen</td></tr>
<tr><td>2. Wachstum</td><td>Nachfrage wächst, erste Gewinne, Bekanntheit steigt; erste Preisanpassungen; Konkurrenz wird aufmerksam</td><td>auf Konkurrenzprodukte einstellen</td></tr>
<tr><td>3. Reife</td><td>Umsatzmaximum, meist längste Phase, meiste Gewinne; mehr Mitbewerber, später sinken Marktanteile und Gewinn</td><td>Produktvariationen, verstärktes Marketing, Rationalisierung in Produktion/Vertrieb</td></tr>
<tr><td>4. Sättigung</td><td>kein Marktwachstum, Gewinne fallen; endet, wenn kein Gewinn mehr erzielt wird</td><td>–</td></tr>
<tr><td>5. Rückgang</td><td>Verkäufe sinken stark, keine Gewinne, Markt schrumpft; Marketing nützt kaum noch</td><td>Produktelimination oder Relaunch (erhebliche Modifizierung, Neuausrichtung)</td></tr></table>
<h4>XPressParcel AG (Lösung)</h4>
<p>Produktpolitik: <b>Produktdiversifikation/-innovation</b>. Ziele: Produktportfolio erweitern, mit dem Wandel (Nachhaltigkeit) mitgehen, <b>Risikostreuung</b> (verschiedene Produkte, verschiedene Märkte). Phase: noch vor der Einführung. Maßnahmen bei Einführung: Präsentation durch Werbung, PR-Maßnahmen, Messen.</p>`,

{id:'m10',n:'10',title:'Preisbildung & Preispolitik',short:'Preispolitik',exam:['14.2'],pages:'S. 94–96, 153–155',diagram:'preis',
summary:`
<h4>Preisbildung</h4>
<ul>
<li>Der Preis bildet sich am Markt durch das <b>Zusammenwirken von Angebot und Nachfrage</b>.</li>
<li>Die Preisbildung hängt von der jeweiligen <b>Marktform</b> ab (vollkommener und unvollkommener Markt).</li>
<li>Unter idealen Bedingungen der vollständigen Konkurrenz bilden sich beim Zusammentreffen von Angebot und Nachfrage der <b>Gleichgewichtspreis</b> und die <b>Gleichgewichtsmenge</b>.</li>
</ul>
<h4>Preispolitik</h4>
<p>Einflussfaktoren: extern Angebot und Nachfrage, Zahl der Mitbewerber, Kundenverhalten, gesetzliche Einflüsse; intern Kosten, Bedarfsentwicklung, Marketingstrategie. Der Preis ist Entgelt für eine Leistung und Maßstab für eine Kaufentscheidung: Er muss die notwendigen <b>Erträge</b> sichern und <b>konkurrenzfähig</b> bleiben.</p>
<p><b>Vier Preisgestaltungen</b>: kostenorientiert, nachfrageorientiert, konkurrenzorientiert, marktorientiert / Target Costing.</p>
<h4>Drei Preisuntergrenzen</h4>
<table class="t"><tr><th>Preisuntergrenze</th><th>Berechnung</th><th>Hinweis</th></tr>
<tr><td>kurzfristig (Teilkostenrechnung)</td><td>Preis = variable Kosten</td><td>kurzfristige Fixkosten tragen andere Produkte</td></tr>
<tr><td>langfristig (Vollkostenrechnung)</td><td>Preis = variable Kosten + Fixkosten</td><td>deutlich höher als kurzfristig</td></tr>
<tr><td>liquiditätsorientiert</td><td>Preis = variable Kosten + Fixkosten + weitere Ausgaben für Lieferanten/Kreditinstitute</td><td>ständige Zahlungsbereitschaft</td></tr></table>
<h4>Instrumente</h4>
<ul>
<li><b>Preismodifizierung</b>: Preis jederzeit so verändern, dass sich die Position des Produkts im Markt verbessert.</li>
<li><b>Preisdifferenzierung</b>: Preis nach <b>zeitlicher, räumlicher, personeller oder sachlicher</b> Art differenzieren, z.&nbsp;B. Mengen- oder Messerabatt für ausgewählte Kundengruppen.</li>
<li><b>Konditionenpolitik</b>: vertragliche Regelungen über Rabatte, Liefer- und Zahlungsbedingungen sowie Garantieverpflichtungen.</li>
</ul>`,

OPEN('Welche Art der Preispolitik würden Sie der XPressParcel AG für ihr neues Produkt empfehlen? Begründen Sie mithilfe der Inhalte des Infotextes.',['Eine der vier Preisgestaltungen nennen (kosten-, nachfrage-, konkurrenz- oder marktorientiert)','Kosten müssen langfristig gedeckt werden (Vollkosten als Untergrenze)','Preis muss Erträge sichern und konkurrenzfähig bleiben','Instrumente: Preisdifferenzierung (z. B. Mengen-/Messerabatt), Konditionen'],'Individuelle Begründung. Beispiel: Da das Produkt neu ist und an andere Transportunternehmen verkauft werden soll, sollte der Preis langfristig mindestens die Vollkosten decken (variable Kosten + Fixkosten), damit die notwendigen Erträge erzielt werden, und zugleich konkurrenzfähig bleiben (Blick auf Mitbewerber und Nachfrage). Zur Markteinführung kann eine Preisdifferenzierung helfen, z. B. Messerabatt oder Mengenrabatt für ausgewählte Kundengruppen; die Konditionenpolitik regelt Rabatte, Liefer-, Zahlungsbedingungen und Garantien.','S. 154–155')
]},

{id:'m11',n:'11',title:'Distributions- & Kommunikationspolitik',short:'Distribution & Kommunikation',exam:['14.2'],pages:'S. 121, 156–157',diagram:null,
summary:`
<h4>Distributionspolitik (LH6)</h4>
<ul>
<li>Distribution = Verteilung: den Weg wählen, auf dem Produkt oder Dienstleistung am besten an den Kunden gelangt, also geeignete <b>Vertriebswege</b>. Auch: auf welchem Weg das Unternehmen seine Leistung anbietet und wie/wo der Kunde sie kaufen kann.</li>
<li>In der Transportbranche steht die <b>Distributionslogistik</b> im Fokus: Verteilung von Gütern vom Produzenten bis zum Kunden.</li>
<li>Distribution = alle Prozesse zwischen Produzenten und Händlern bis zum Letztabnehmer im Absatzkanal (Beispiel Bier: Einzelhandel, Tankstellen, Gaststätten).</li>
<li>In KEP-Unternehmen ist die persönliche Kundenbeziehung besonders wichtig: Es dominiert das <b>persönliche Verkaufsgespräch</b> und dessen Anbahnung. Spektrum: Organisation des Vertriebs (nach Produkten, Regionen, Kunden) bis zur Gestaltung von Verkaufsgesprächen.</li>
<li><b>Direkter Vertrieb</b>: kein Mittler, direkter Kontakt zwischen Anbieter und Nachfrager. <b>Indirekter Vertrieb</b> über geeignete Portale/Zusammenschlüsse möglich.</li>
<li>Relevanz in der Transportbranche wegen der vielen Dienstleistungen sehr hoch. Maßnahmen z.&nbsp;B.: persönlicher Kontakt, Verkaufsgespräche (je nach Kundentyp), Mailingaktionen.</li>
</ul>
<h4>Kommunikationspolitik (AA 21)</h4>
<p>Maßnahmen, deren Ziel es ist, ein Produkt durch Kommunikation bekannt zu machen und dessen Verkauf zu fördern.</p>
<table class="t"><tr><th>Bereich</th><th>Definition</th><th>Beispiele / Arten</th></tr>
<tr><td>Werbung</td><td>systematische Beeinflussung von (potenziellen) Käufern; Mittel der Verhaltenssteuerung</td><td><b>Einführungswerbung</b> (neues Produkt bekannt machen), <b>Expansionswerbung</b> (Umsatzsteigerung eines bekannten Produkts), <b>Erinnerungswerbung</b> (Bekanntheitsgrad erhalten)</td></tr>
<tr><td>Sales Promotion</td><td>Verkaufsförderung: Werbung wird durch zusätzliche Kaufanreize unterstützt</td><td>Messestände, Proben/Muster, Kalender oder Kugelschreiber zu Weihnachten, Eintrittskarten für Musical/Fußball</td></tr>
<tr><td>Public Relations</td><td>Öffentlichkeitsarbeit: Imageförderung durch positive öffentliche Meinung</td><td>Pressekonferenzen, Betriebsbesichtigungen, Vorträge, Broschüren</td></tr></table>
<p class="note">Werbeart passend zum Produktlebenszyklus wählen: Ein neues Produkt (Einführung) braucht Einführungswerbung; ein bekanntes Produkt, dessen Umsatz wachsen soll, Expansionswerbung; ein etabliertes Produkt, dessen Bekanntheit erhalten werden soll, Erinnerungswerbung (abgeleitet aus den Definitionen im Skript).</p>`,
recall:['Vertriebswege','Distributionslogistik','Absatzkanal','persönliches Verkaufsgespräch','direkter Vertrieb','indirekter Vertrieb','Portale','Mittler','Einführungswerbung','Expansionswerbung','Erinnerungswerbung','Sales Promotion','Public Relations','Messe'],

{id:'m12',n:'12',title:'Kundendienst',short:'Kundendienst',exam:['14.2'],pages:'S. 159–163, 183–186, 195',diagram:'kundendienst',
summary:`
<p class="lead"><b>Kundendienst</b> (Kundenservice, engl. <b>Customer Service</b>) = organisatorische Einheit (Abteilung) eines Unternehmens, die Kunden zusätzlich zum Produkt oder zur Dienstleistung weitere Dienste anbietet, sogenannte <b>Zusatzleistungen</b>.</p>
<ul>
<li>Zusatzleistungen können bestehen aus <b>Waren</b> (Proben, Zugaben), <b>Dienstleistungen</b> (Montagehilfen) und <b>Rechten</b> (Umtauschrecht).</li>
<li>Aufgabenbereiche: Förderung der <b>Kundenzufriedenheit</b>, <b>Kundenpflege</b>, <b>Beschwerdemanagement</b>.</li>
<li>Ziel: Gewinnung und Pflege von <b>Dauerkunden</b>.</li>
<li>Zuordnung: <b>Kommunikationspolitik</b>, denn sie zielt darauf ab, Kunden und Öffentlichkeit zu informieren und mit ihnen zu kommunizieren; der Kunde steht im Fokus. (Preispolitik: Preisbildung; Produktpolitik: Produkt und Bedürfnisse, nicht der Kunde selbst; Distribution: „Wie bringe ich mein Produkt an den Kunden?“)</li>
</ul>
<h4>Formen nach dem Zeitpunkt</h4>
<table class="t"><tr><th>Form</th><th>Wann</th><th>XPressParcel AG</th></tr>
<tr><td>Pre-Sales-Service</td><td>vor dem Kauf</td><td>Beratung: optimale Dienstleistung im Kundengespräch aufzeigen</td></tr>
<tr><td>At-Sales-Service</td><td>während des Kaufs</td><td>Sendungsverfolgung mit Nummer; Kontakt bei Lieferschwierigkeiten</td></tr>
<tr><td>After-Sales-Service</td><td>nach dem Kauf</td><td>Reklamation/Beschwerdemanagement nach Lieferproblemen</td></tr></table>
<h4>Formen nach der Art</h4>
<table class="t"><tr><th>Art</th><th>Beispiele</th></tr>
<tr><td>warengebunden</td><td>Lieferservice, Montageservice (XPressParcel: Sendungsverfolgungsnummern)</td></tr>
<tr><td>nicht warengebunden</td><td>Kindergärten im Einkaufscenter</td></tr>
<tr><td>technisch</td><td>Installation, Wartungsservice</td></tr>
<tr><td>kaufmännisch</td><td>kaufmännische Beratung, Reklamationen (Hauptbestandteil bei Transportunternehmen)</td></tr></table>
<h4>Bedeutung des Kundendienstes</h4>
<p>Guter Kundenservice = hohe Kundenzufriedenheit = Kundenbindung. In sozialen Medien verbreitet sich Unzufriedenheit schnell → Imageschaden vermeiden. Oft hat nur der Kundendienst direkten Kundenkontakt: Beziehungen aufbauen/stärken, Kundenverluste vermeiden, Reklamationen bearbeiten und auswerten, Anregungen für interne Abläufe geben, direktes Feedback einholen.</p>`,
recall:['Customer Service','Zusatzleistungen','Waren','Dienstleistungen','Rechte|Rechten','Kundenzufriedenheit','Kundenpflege','Beschwerdemanagement','Dauerkunden','Pre-Sales','At-Sales','After-Sales','warengebunden','nicht warengebunden','technisch','kaufmännisch','Kommunikationspolitik','Imageschaden','Feedback'],

OPEN('Erläutern Sie, warum der Kundendienst eine der wichtigsten Abteilungen ist und welche Möglichkeiten er dem Unternehmen bietet.',['Guter Kundenservice → Kundenzufriedenheit → Kundenbindung','Unzufriedenheit verbreitet sich über soziale Medien schnell: Imageschaden vermeiden','Oft einziger direkter Kundenkontakt','Möglichkeiten: Beziehungen stärken, Kundenverluste vermeiden, Reklamationen auswerten, Anregungen für Abläufe, direktes Feedback'],'Guter Kundenservice führt zu hoher Kundenzufriedenheit und damit zu Kundenbindung. Gerade über soziale Medien verbreitet sich Unzufriedenheit schnell, der Kundendienst kann einen Imageschaden vermeiden. Zum Teil hat nur der Kundendienst direkten Kontakt zum Kunden. Er kann Kundenbeziehungen aufbauen und stärken, Kundenverluste vermeiden, Reklamationen/Beschwerden entgegennehmen, bearbeiten und auswerten, um sie künftig zu vermeiden, Anregungen für interne Strukturen und Arbeitsabläufe geben und direktes Kundenfeedback einholen.','S. 195')

{id:'m13',n:'13',title:'Kundenzufriedenheit & Kundenpflege',short:'Zufriedenheit & Pflege',exam:['14.2'],pages:'S. 123–128, 164–171, 187–190, 196–197',diagram:'zufriedenheit',
summary:`
<p class="lead"><b>Kundenzufriedenheit</b> = Grad der Zufriedenheit eines Kunden mit dem erworbenen Produkt oder der bestellten Dienstleistung. Je stärker seine Erwartungen erfüllt oder übertroffen werden, desto größer die Zufriedenheit.</p>
<h4>Entstehung: ein psychologischer Prozess</h4>
<p>Der Kunde vergleicht seine <b>Erwartungen</b> mit der <b>Wahrnehmung</b> der Leistung. Erwartungen entstehen aus Bedürfnissen, Erfahrungen und der Kommunikationspolitik des Unternehmens.</p>
<ul>
<li>Wahrnehmung übertrifft die Erwartung → <b>Zufriedenheit</b></li>
<li>Erwartung entspricht der Wahrnehmung → <b>neutral</b></li>
<li>Erwartung übertrifft die Wahrnehmung → <b>Unzufriedenheit</b></li>
</ul>
<p>Gleichung laut Lösung (AA 8): <b>Kundenzufriedenheit = Kundenerwartungen − Erwartungserfüllung</b>.</p>
<p><b>Bedeutung</b>: Indikator für die wahrgenommene Leistung, Spiegel für mögliche Maßnahmen, zufriedene Kunden = „Wiederholungskäufer“. Stetige Rückmeldung; hohe Unzufriedenheit birgt die Gefahr, Kunden zu verlieren; hohe Zufriedenheit führt über Mund-zu-Mund-Propaganda zu Weiterempfehlung.</p>
<h4>Kundenumfrage XPressParcel AG (250 Befragte)</h4>
<p>Zufrieden mit: Zustellern 92 %, Qualität der Lieferung 91 %, fachlicher Beratung 87 %, Pünktlichkeit 82 %, <b>Erreichbarkeit des Kundendienstes nur 62 %</b>. Gesamturteil Kundendienst: 51 % sehr zufrieden, 26 % zufrieden, 18 % nicht zufrieden, 5 % gar nicht zufrieden. Am wichtigsten: kompetente Auskunft 100 %, Erreichbarkeit 98 %, Freundlichkeit 98 %, schneller Support 91 %, Kundenorientierung 86 %, Verständnis 78 %.</p>
<p class="note">Kernproblem: Die Erreichbarkeit ist den Kunden sehr wichtig (98 %), aber nur 62 % sind damit zufrieden.</p>
<h4>Kundenpflege (CRM)</h4>
<ul>
<li><b>Bedeutung</b>: konsequente Ausrichtung der Aktivitäten auf die Kunden und systematische Gestaltung der Kundenbeziehungsprozesse (Customer-Relationship-Management).</li>
<li><b>Ziel</b>: Kundentreue. Beziehungen kontinuierlich pflegen; Prinzip: erst auf das „Beziehungskonto“ einzahlen, dann abheben; Schritt für Schritt eine Kunden-Community schaffen.</li>
<li><b>Maßnahmen</b>: im Kontakt bleiben (Newsletter, Flyer, Webauftritt), persönliche Informationen notieren (Geburtstage, Hobbys), persönliche Gespräche, rechtzeitig über Veränderungen informieren, kleine Geschenke/Einladungen, Präsente/Boni/Kundenkarten, Rabattaktionen/Sonderangebote, Servicequalität erhöhen, Gepflogenheiten im Ausland beachten.</li>
</ul>
<h4>Formen der Kundenbeziehung (LH10)</h4>
<p>Einen Neukunden zu gewinnen kostet laut Studien <b>fünfmal</b> so viel wie einen Bestandskunden zu halten; einen verlorenen Kunden zurückzugewinnen noch mehr. Kundenpflege gilt für <b>alle</b> Kundenformen: Neukunden überzeugen → zu Stammkunden machen → Stammkunden halten (wichtigster Punkt) → zufriedene Stammkunden werden <b>Multiplikatoren</b> (Mund-zu-Mund-Propaganda).</p>`,
recall:['Erwartungen','Wahrnehmung','psychologischer Prozess','Zufriedenheit','neutral','Unzufriedenheit','Bedürfnisse','Erfahrungen','Wiederholungskäufer','Erreichbarkeit','CRM|Customer-Relationship','Kundentreue','Beziehungskonto','Newsletter','Neukunden','Stammkunden','Multiplikator','fünfmal|5','Mund-zu-Mund'],

{id:'m14',n:'14',title:'Beschwerdemanagement',short:'Beschwerdemanagement',exam:['14.2'],pages:'S. 129–131, 172–174, 191–193, 198',diagram:'beschwerde',
summary:`
<p class="lead"><b>Beschwerdemanagement</b> (auch Reklamationsmanagement) gehört zu den Aufgabenbereichen des Kundendienstes und ist wesentlicher Bestandteil des Kundenbeziehungsmanagements: der professionelle Umgang mit der von Kunden mitgeteilten Unzufriedenheit über Produkte oder Dienstleistungen.</p>
<h4>Arten</h4>
<table class="t"><tr><th>Art</th><th>Beschreibung</th></tr>
<tr><td>Aktives (direktes)</td><td>geht aktiv auf Kunden zu; Unzufriedenheit wird erkannt und Kunden direkt angesprochen; höhere Kunden- und Serviceorientierung, Fehlerkultur wird positiv wahrgenommen</td></tr>
<tr><td>Reaktives</td><td>reagiert auf Kundenbeschwerden; Kunden können Beschwerden mitteilen (Telefon, E-Mail, Beschwerdeportal)</td></tr>
<tr><td>Indirektes</td><td>läuft intern, nachdem die Beschwerde erfasst wurde; Beschwerdedaten für interne Fehleranalyse und -verbesserung</td></tr></table>
<h4>Ablauf des direkten Beschwerdemanagementprozesses</h4>
<ol>
<li><b>Beschwerdestimulierung</b>: unzufriedene Kunden aktivieren, ihre Probleme zu äußern (nur ein Bruchteil beschwert sich); leicht nutzbare Beschwerdekanäle einrichten und bekannt machen.</li>
<li><b>Beschwerdeannahme</b>: unmittelbare Reaktion im Erstkontakt (Freundlichkeit!); Mitarbeiter kennen Wege und Standards, haben sozialpsychologische Kenntnisse; Problem vollständig, schnell und strukturiert erfassen.</li>
<li><b>Beschwerdebearbeitung</b>: interne Prozesse gestalten, Verantwortlichkeiten und Bearbeitungstermine festlegen, Termine überwachen (Mahn- und Eskalationssysteme).</li>
<li><b>Beschwerdereaktion</b>: Leitlinien für die Beantwortung; Lösung anbieten: <b>finanziell</b> (Preisnachlass, Schadensersatz), <b>materiell</b> (Umtausch, Reparatur), <b>immateriell</b> (Entschuldigung, Information); einzelfallbezogen und fair.</li>
</ol>
<p>Indirekter Prozess: Beschwerdeauswertung, Beschwerdemanagement-Controlling, Beschwerdereporting, Beschwerdeinformationsnutzung.</p>
<h4>Mögliche Reaktionen</h4>
<p>Rückmeldung ernst nehmen, Entschuldigung, Wiedergutmachung/Kompensation oder Überkompensation, Veränderung von Produkt/Dienstleistung, Organisationsänderung, Verhaltensänderung von Mitarbeitern, auf „falsche“ Beschwerden konsequent und sachlich reagieren (Grenzen aufzeigen).</p>
<h4>Ziele und Chancen</h4>
<ul>
<li>Ein unzufriedener Kunde wirkt als <b>negativer Multiplikator</b> (Rufschaden durch Mund-zu-Mund-Propaganda).</li>
<li><b>Ziel</b>: unzufriedene Kunden durch kulante Lösungen und schnelle, sorgfältige Ursachenbeseitigung zufriedenstellen; <b>Gewinn und Wettbewerbsfähigkeit</b> erhöhen, Abwanderung vermeiden, Hinweise auf Schwächen und Marktchancen nutzen.</li>
<li>Kunden sollen sich unkompliziert und formlos melden können; Transparenz bei Zuständigkeiten.</li>
<li><b>Chancen</b>: Kunden fühlen sich ernst genommen und werden <b>positive Multiplikatoren</b>; Beschwerden sind Quelle für kontinuierliche Verbesserung (<b>Kai-Zen</b>); kritische Kunden sagen, was viele andere nicht äußern.</li>
</ul>
<h4>Fall: Facebook-Seite der XPressParcel AG</h4>
<p>Wenig Likes, viele Kommentare; eine Kundin teilt negative Erfahrungen; ein potenzieller Neukunde will deshalb einen anderen Paketdienst wählen; keine angemessene Reaktion (Verweis auf die Hotline, die der Kunde schon erfolglos versucht hat); Rechtschreibfehler in der Antwort.</p>`,

OPEN('Was fällt Ihnen am Facebook-Eintrag der XPressParcel AG auf? Was hätte der Kundendienst besser machen müssen?',['Wenig Likes, viele (negative) Kommentare, Kundenunzufriedenheit','Potenzieller Neukunde wendet sich ab (negativer Multiplikator)','Keine angemessene Reaktion: Verweis auf die Hotline, die schon nicht erreichbar war','Rechtschreibfehler in der Antwort','Besser: schnell, freundlich, Problem erfassen, Lösung/Kompensation anbieten'],'Auffällig: wenig Likes, viele Kommentare; eine Kundin teilt negative Erfahrungen mit der Community; ein potenzieller Neukunde liest das und will einen anderen Paketdienst wählen; der Kundendienst reagiert nicht angemessen (Verweis auf die Hotline, die die Kundin bereits erfolglos versucht hat) und mit Rechtschreibfehlern. Besser: schnelle, freundliche, fehlerfreie Antwort, das Anliegen ernst nehmen, sich entschuldigen, das Problem direkt aufnehmen (Beschwerdeannahme), eine Lösung bzw. Kompensation anbieten und intern die Erreichbarkeit verbessern sowie Mitarbeiter schulen.','S. 191'),
OPEN('Erstellen Sie einen Leitfaden zur Kundenkommunikation in Beschwerde- bzw. Reklamationssituationen.',['Freundlich und ruhig reagieren, Rückmeldung ernst nehmen','Problem vollständig, schnell und strukturiert erfassen','Kundentyp erkennen und darauf eingehen','Zuständigkeit klären, Bearbeitung und Termine festlegen','Lösung anbieten: finanziell, materiell oder immateriell; Entschuldigung','Ursachen beseitigen, Beschwerde intern auswerten'],'1. Freundlich begrüßen, ruhig bleiben, zuhören, Anliegen ernst nehmen. 2. Problem vollständig, schnell und strukturiert erfassen (Sendung, Schaden, Termin). 3. Kundentyp erkennen (blau: Fakten; grün: Sicherheit, Zeit; gelb: Beziehung; rot: klar und präzise). 4. Entschuldigen und Verständnis zeigen. 5. Zuständigkeit und Bearbeitungszeit transparent nennen. 6. Faire Lösung anbieten: finanziell (Preisnachlass, Schadensersatz), materiell (Ersatz) oder immateriell (Information). 7. Auf unberechtigte Beschwerden sachlich reagieren und Grenzen aufzeigen. 8. Nachfassen und Beschwerde intern auswerten, um Fehlerquellen zu beseitigen. Gleiches gilt für A-, B- und C-Kunden.','S. 130–134, 178')

{id:'m15',n:'15',title:'Kundentypen (4-Farben-Modell)',short:'Kundentypen',exam:['14.2'],pages:'S. 132–134',diagram:'farben',
summary:`
<p class="lead">Menschen sind unterschiedlich, es gibt kein Patentrezept. Persönlichkeitstypisierungen helfen, Kunden schneller zu durchschauen. Bekannt: das <b>4-Farben-Modell von Frank M. Scheelen</b> mit roten, blauen, gelben und grünen Menschen.</p>
<table class="t"><tr><th>Typ</th><th>Erkennbar an</th><th>Optimaler Umgang</th></tr>
<tr><td><span class="sw blue"></span><b>Blau</b>: rationaler Denker</td><td>diszipliniert, ordentlich, reflektiert; hoher Analysebedarf (Vor- und Nachteile abwägen); keine schnelle Kaufentscheidung; viele Nachfragen</td><td>umfassende Informationen und Details; Fakten vor persönlicher Beziehung; Zeit lassen, aber aktiv auf eine Entscheidung hinwirken (schiebt gern auf), ohne zu viel Druck</td></tr>
<tr><td><span class="sw green"></span><b>Grün</b>: Zögerer</td><td>konservativ, risikoscheu; braucht Zeit; freundlich, zurückhaltend, verlässlich; hält an Bewährtem fest, steht Neuem kritisch gegenüber</td><td>aufmerksam zuhören (welches Risiko vermeiden?); Argumente gegen die Risikoscheu; Mitentscheider einbeziehen; Worte wie „mitteilen, erwähnen, informieren, Argumente“; mehr Zeit, längeres Gespräch</td></tr>
<tr><td><span class="sw yellow"></span><b>Gelb</b>: Kreativer</td><td>offen für Neues; schnell begeistert; optimistisch, steckt andere an; schnell abgelenkt, Euphorie kippt</td><td>Zeit investieren, vertraute Beziehung aufbauen (Privates willkommen); Konflikte meiden; Demonstration/Präsentation in den Vordergrund; Worte wie „demonstrieren, Überblick, Vorstellung“, „Schauen Sie sich das an“</td></tr>
<tr><td><span class="sw red"></span><b>Rot</b>: dominanter Macher</td><td>dominant, kontrollierend; provoziert bewusst; offen für Neues bei positiven Resultaten; keine persönliche Ebene</td><td>entschlossen, selbstbewusst auftreten; ihn sich etwas überlegen fühlen lassen; keine persönlichen Gespräche oder übertriebene Freundlichkeit; klare Argumente, präzise Antworten</td></tr></table>
<p class="note"><b>Achtung Farbwechsler</b>: Unter Stress kann der Typ ins Gegenteil umschlagen: Blau wird Gelb, Grün wird Rot und umgekehrt. In jeder Situation neu auf die Signale achten.</p>`,
recall:['Scheelen','blau','grün','gelb','rot','rational|Denker','Zögerer','Kreativ','dominant|Macher','Fakten','Details','Risiko','Mitentscheider','Beziehung','Demonstration|Präsentation','klare Argumente','Farbwechsler','Stress'],
items:[
C('Welche vier Kundentypen unterscheidet das 4-Farben-Modell (Scheelen)?','Blau: rationaler Denker\nGrün: Zögerer\nGelb: Kreativer\nRot: dominanter Macher','S. 132–134'),
C('Wie gehe ich mit dem blauen Kundentyp um?','Umfassende Informationen und Details, Fakten vor Beziehung, Zeit zum Durchdenken lassen, aber aktiv auf eine Entscheidung hinwirken, ohne zu viel Druck.','S. 132'),
C('Wie gehe ich mit dem grünen Kundentyp um?','Aufmerksam zuhören (welches Risiko will er vermeiden?), Argumente gegen die Risikoscheu, Mitentscheider gewinnen, Worte wie „informieren, Argumente“, mehr Zeit und längeres Gespräch.','S. 133'),
C('Wie gehe ich mit dem gelben Kundentyp um?','Zeit investieren, vertraute Beziehung aufbauen, Konflikte vermeiden, Demonstration/Präsentation in den Vordergrund, Worte wie „demonstrieren, Überblick“.','S. 133'),
C('Wie gehe ich mit dem roten Kundentyp um?','Entschlossen und selbstbewusst auftreten, ihn sich etwas überlegen fühlen lassen, keine persönlichen Gespräche oder übertriebene Freundlichkeit, klare Argumente und präzise Antworten.','S. 134'),
C('Was bedeutet „Farbwechsler“?','Unter Stress kann der Kundentyp ins Gegenteil umschlagen: Blau wird Gelb, Grün wird Rot und umgekehrt. Daher in jeder Situation neu auf die Signale achten.','S. 134'),
CAT('Welcher Kundentyp wird beschrieben?',['Blau (rationaler Denker)','Grün (Zögerer)','Gelb (Kreativer)','Rot (dominanter Macher)'],[
['Stellt viele Nachfragen und wägt Vor- und Nachteile sorgfältig ab',0],
['Hält lieber an Bewährtem fest und steht Neuem kritisch gegenüber',1],
['Ist schnell begeistert, wird aber leicht abgelenkt',2],
['Tritt kontrollierend auf und provoziert bewusst',3],
['Legt viel Wert auf die Meinung anderer (Mitentscheider)',1],
['Spricht gern über Privates, die Beziehungsebene ist ihm sehr wichtig',2],
['Fakten stehen deutlich über der persönlichen Beziehung',0],
['Will keine persönliche Ebene, aber positive Resultate',3]],'','S. 132–134'),
CAT('Welche Formulierung passt am besten zu welchem Typ?',['Blau','Grün','Gelb','Rot'],[
['„Hier sind alle Kennzahlen und Details zum Vergleich.“',0],
['„Ich möchte Sie gern über die Absicherung informieren.“',1],
['„Schauen Sie sich das einmal an, ich demonstriere es Ihnen.“',2],
['„Kurz und klar: Das Ergebnis sind 15 % schnellere Zustellung.“',3]],'','S. 132–134'),
MC('Ein Kunde reagiert unter Stress plötzlich ganz anders. Ein bisher grüner Kunde wird zu …',['Blau','Gelb','Rot','bleibt Grün'],2,'Farbwechsler: Grün wird Rot und umgekehrt, Blau wird Gelb und umgekehrt.','S. 134'),
TF('Beim roten Kundentyp sollte man durch besonders viel persönliche Freundlichkeit und Smalltalk punkten.',false,'Keine persönlichen Gespräche oder übertriebene Freundlichkeit; klare Argumente.','S. 134'),
TF('Blaue Kunden versuchen gern, Entscheidungen aufzuschieben.',true,'Daher aktiv auf eine Entscheidung hinwirken, ohne zu schnell zu viel Druck auszuüben.','S. 132'),
OPEN('Erstellen Sie eine Übersicht der vier Kundentypen mit Erkennungsmerkmalen und Umgang.',['Blau: rational, analytisch, viele Nachfragen → Fakten, Details, Zeit, aber zur Entscheidung führen','Grün: risikoscheu, konservativ → zuhören, Sicherheit, Mitentscheider, mehr Zeit','Gelb: begeistert, kreativ, schnell abgelenkt → Beziehung, Präsentation, Begeisterung halten','Rot: dominant, kontrollierend → selbstbewusst, klar, präzise, keine Privatebene','Farbwechsler unter Stress beachten'],'Blau (rationaler Denker): diszipliniert, analysiert, viele Nachfragen → umfassende Fakten und Details, Zeit lassen, aktiv zur Entscheidung führen. Grün (Zögerer): konservativ, risikoscheu → aufmerksam zuhören, Risiken entkräften, Mitentscheider einbeziehen, längeres Gespräch. Gelb (Kreativer): offen, schnell begeistert, schnell abgelenkt → Beziehung aufbauen, Konflikte meiden, Produkt demonstrieren. Rot (dominanter Macher): dominant, provokant, keine persönliche Ebene → entschlossen auftreten, ihn sich überlegen fühlen lassen, klare Argumente. Unter Stress können Typen wechseln (Blau↔Gelb, Grün↔Rot).','S. 132–134')
]}

const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5;

const norm=s=>String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
const fuzzyEq=(inp,alts)=>{const x=norm(inp);if(!x)return false;return alts.some(a=>{const y=norm(a);return x===y||(y.length>6&&lev(x,y)<=1)})};

function daysLeft(){if(!S.examDate)return null;const e=new Date(S.examDate+'T08:00:00');return Math.ceil((e-new Date())/DAY)}
function review(id,g){ // g: 0 Nochmal, 1 Schwer, 2 Gut, 3 Leicht
  const st=S.items[id]||{r:0,iv:0,ef:2.3,due:0,l:0,h:[]};
  if(g===0){st.r=0;st.iv=0;st.l++;st.ef=Math.max(1.3,st.ef-0.2);st.due=Date.now()+10*60*1000}
  else{
    st.r++;
    if(st.r===1)st.iv=[0,1,1,3][g];else if(st.r===2)st.iv=[0,2,3,6][g];else st.iv=Math.round(st.iv*st.ef*(g===1?0.6:g===3?1.3:1));
    st.ef=Math.min(2.8,Math.max(1.3,st.ef+[-0.2,-0.15,0,0.15][g]));
    const dl=daysLeft();if(dl!==null&&dl>1)st.iv=Math.min(st.iv,Math.max(1,Math.floor(dl/2)));
    st.iv=Math.max(1,st.iv);
